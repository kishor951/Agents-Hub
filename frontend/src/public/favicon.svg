<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0A0B10" rx="4"/>
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified USB/Connection icon for favicon -->
  <g transform="translate(8, 6)">
    <!-- Top connector -->
    <rect x="5" y="0" width="6" height="4" fill="url(#faviconGradient)" rx="1"/>
    <line x1="8" y1="4" x2="8" y2="8" stroke="url(#faviconGradient)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center connection -->
    <circle cx="8" cy="10" r="2.5" fill="none" stroke="url(#faviconGradient)" stroke-width="1.5"/>
    
    <!-- Diagonal lines -->
    <line x1="7" y1="12" x2="3" y2="16" stroke="url(#faviconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="12" x2="13" y2="16" stroke="url(#faviconGradient)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom connectors -->
    <rect x="0" y="16" width="6" height="4" fill="url(#faviconGradient)" rx="1"/>
    <rect x="10" y="16" width="6" height="4" fill="url(#faviconGradient)" rx="1"/>
  </g>
</svg>
